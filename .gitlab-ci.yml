image: docker.io/zazukoians/node-java-jena:v6

stages:
  - deps
  - build

# Fetch dependencies once
fetch-deps:
  stage: deps
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 week

# Jobs to build each dataset in parallel
code:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - mkdir -p output
    - npm -s run code:stdout > output/code.nq
  except:
    variables:
      - $CRON

mirror_swisstopo:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - mkdir -p output
    - npm -s run mirror:swisstopo:stdout > output/mirror_swisstopo.nq
