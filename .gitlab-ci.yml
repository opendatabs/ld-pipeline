static:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - mkdir -p output
    - npm -s run static:stdout > output/static.nq
    # The static output spans multiple named graphs (one per input file),
    # so upload each graph separately: a graph-scoped PUT clears it first
    - |
      for g in $(awk '{print $(NF-1)}' output/static.nq | sort -u); do
        graph="${g#<}"; graph="${graph%>}"
        echo "Uploading ${graph}"
        grep -F " ${g} ." output/static.nq | sed "s| ${g} \.$| .|" \
          | curl -sSf -X PUT \
              -H "Content-Type: application/n-triples" \
              -H "Authorization: Bearer ${SPARQL_TOKEN}" \
              --data-binary @- \
              "${SPARQL_ENDPOINT}?graph=${graph}"
      done
  except:
    variables:
      - $CRON

