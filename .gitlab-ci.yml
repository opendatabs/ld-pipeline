image: node:24-alpine

variables:
  target: "store"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"'
      variables:
        target: "stdout"
    - when: always

stages:
  - deps
  - build
  - store
  - trigger

# Fetch dependencies once
fetch-deps:
  stage: deps
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 week

# Fuseki
code:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - npm run code:${target} > output/code.nt
  artifacts:
    paths:
      - output/code.nt
    expire_in: 1 week
    when: always
  except:
    variables:
      - $CRON

mirror_swisstopo:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - npm run mirror:swisstopo:${target} > output/mirror_swisstopo.nt
  artifacts:
    paths:
      - output/mirror_swisstopo.nt
    expire_in: 1 week
    when: always
  except:
    variables:
      - $CRON

