image: node:24-alpine

stages:
  - deps
  - build
  - store

# Fetch dependencies once
fetch-deps:
  stage: deps
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 week

# Fuseki
code:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - npm run code:store
  except:
    variables:
      - $CRON

mirror_swisstopo:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - npm run mirror:swisstopo:store
  except:
    variables:
      - $CRON

ogd_void:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - npm run ogd-void:store
  except:
    variables:
      - $CRON

raum:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - npm run raum:store
  except:
    variables:
      - $CRON

static:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - npm run static:store
  except:
    variables:
      - $CRON

ogd_daily:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - npm run ogd:store:daily
  only:
    variables:
      - $CRON && $CRON_OGD_DAILY

ogd_monthly:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - npm run ogd:store:monthly
  only:
    variables:
      - $CRON && $CRON_OGD_MONTHLY

ogd_weekly:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - npm run ogd:store:weekly
  only:
    variables:
      - $CRON && $CRON_OGD_WEEKLY

rhein_ues_weil_corrected:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - npm run rhein-ues-weil:corrected:store
  only:
    variables:
      - $CRON && $CRON_RHEIN_UES_WEIL_CORRECTED

rhein_ues_weil_raw:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - npm run rhein-ues-weil:raw:store
  only:
    variables:
      - $CRON && $CRON_RHEIN_UES_WEIL_RAW

# QLever
qlever-code:
  stage: build
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - mkdir -p /output
    - npm run code:stdout > /output/code.nt
  artifacts:
    paths:
      - output/code.nt
    expire_in: 1 week
  except:
    variables:
      - $CRON

qlever-mirror_swisstopo:
  stage: build
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - mkdir -p /output
    - npm run mirror:swisstopo:stdout > /output/mirror_swisstopo.nt
  artifacts:
    paths:
      - output/mirror_swisstopo.nt
    expire_in: 1 week
  except:
    variables:
      - $CRON

qlever-ogd_void:
  stage: build
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - mkdir -p /output
    - npm run ogd-void:stdout > /output/ogd_void.nt
  artifacts:
    paths:
      - output/ogd_void.nt
    expire_in: 1 week
  except:
    variables:
      - $CRON

qlever-raum:
  stage: build
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - mkdir -p /output
    - npm run raum:stdout > /output/raum.nt
  artifacts:
    paths:
      - output/raum.nt
    expire_in: 1 week
  except:
    variables:
      - $CRON

qlever-static:
  stage: build
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - mkdir -p /output
    - npm run static:stdout > /output/static.nt
  artifacts:
    paths:
      - output/static.nt
    expire_in: 1 week
  except:
    variables:
      - $CRON

qlever-ogd_daily:
  stage: build
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - mkdir -p /output
    - npm run ogd:stdout:daily > /output/ogd_daily.nt
  artifacts:
    paths:
      - output/ogd_daily.nt
    expire_in: 1 week
  only:
    variables:
      - $CRON && $CRON_OGD_DAILY

qlever-ogd_monthly:
  stage: build
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - mkdir -p /output
    - npm run ogd:stdout:monthly > /output/ogd_monthly.nt
  artifacts:
    paths:
      - output/ogd_monthly.nt
    expire_in: 1 week
  only:
    variables:
      - $CRON && $CRON_OGD_MONTHLY

qlever-ogd_weekly:
  stage: build
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - mkdir -p /output
    - npm run ogd:stdout:weekly > /output/ogd_weekly.nt
  artifacts:
    paths:
      - output/ogd_weekly.nt
    expire_in: 1 week
  only:
    variables:
      - $CRON && $CRON_OGD_WEEKLY

qlever-rhein_ues_weil_corrected:
  stage: build
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - mkdir -p /output
    - npm run rhein-ues-weil:corrected:stdout > /output/rhein_ues_weil_corrected.nt
  artifacts:
    paths:
      - output/rhein_ues_weil_corrected.nt
    expire_in: 1 week
  only:
    variables:
      - $CRON && $CRON_RHEIN_UES_WEIL_CORRECTED

qlever-rhein_ues_weil_raw:
  stage: build
  needs:
    - job: fetch-deps
      artifacts: true
  script:
    - mkdir -p /output
    - npm run rhein-ues-weil:raw:stdout > /output/rhein_ues_weil_raw.nt
  artifacts:
    paths:
      - output/rhein_ues_weil_raw.nt
    expire_in: 1 week
  only:
    variables:
      - $CRON && $CRON_RHEIN_UES_WEIL_RAW

store-all:
  stage: store
  needs:
    - job: qlever-code
      artifacts: true
      optional: true
    - job: qlever-mirror_swisstopo
      artifacts: true
      optional: true
    - job: qlever-ogd_void
      artifacts: true
      optional: true
    - job: qlever-raum
      artifacts: true
      optional: true
    - job: qlever-static
      artifacts: true
      optional: true
    - job: qlever-ogd_daily
      artifacts: true
      optional: true
    - job: qlever-ogd_monthly
      artifacts: true
      optional: true
    - job: qlever-ogd_weekly
      artifacts: true
      optional: true
    - job: qlever-rhein_ues_weil_corrected
      artifacts: true
      optional: true
    - job: qlever-rhein_ues_weil_raw
      artifacts: true
      optional: true
  script:
    - ls -alh output/
