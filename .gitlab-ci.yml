image: docker.io/zazukoians/node-java-jena:v6

stages:
  - deps
  - build

# Fetch dependencies once
fetch-deps:
  stage: deps
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 week

# Jobs to build each dataset in parallel
code:
  stage: build
  allow_failure: true
  needs:
    - job: fetch-deps
      artifacts: true
  variables:
    GRAPH_NAME: "https://ld.bs.ch/graph/code"
  script:
    - mkdir -p output
    - npm -s run code:stdout > output/code.nq
    - |
      curl -sSf -X PUT \
        -H "Content-Type: application/n-quads" \
        -H "Authorization: Bearer ${SPARQL_TOKEN}" \
        -T output/code.nq \
        "${SPARQL_ENDPOINT}?graph=${GRAPH_NAME}"
  except:
    variables:
      - $CRON

